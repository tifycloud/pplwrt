name: CompanyWrt stable build

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      channel:
        description: 'stable or beta'
        required: true
        default: stable
        type: choice
        options: [stable, beta]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      SOURCE_DATE_EPOCH: '1783468800'
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build official ImageBuilder image
        shell: bash
        run: |
          set -euo pipefail
          channel='${{ inputs.channel || 'stable' }}'
          ./scripts/build-imagebuilder.sh --profile xiaomi_ax9000 --channel "$channel"
      - name: Verify artifacts
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/verify-shell.sh
          tests/ax9000/test-profile.sh
          tests/ax9000/test-network-generator.sh
          tests/ax9000/test-ota.sh
          tests/ax9000/test-ui.sh
          cd artifacts/${{ inputs.channel || 'stable' }}
          sha256sum -c SHA256SUMS
      - name: Upload firmware artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: companywrt-${{ inputs.channel || 'stable' }}-${{ github.sha }}
          path: artifacts/${{ inputs.channel || 'stable' }}/
          if-no-files-found: error
          retention-days: 30
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          channel='${{ inputs.channel || 'stable' }}'
          gh release create "$GITHUB_REF_NAME" artifacts/"$channel"/* \
            --title "CompanyWrt $GITHUB_REF_NAME ($channel)" \
            --notes-file docs/CHANGELOG.md
