name: CompanyWrt signed release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      channel:
        description: 'Signed build channel (stable requires completed hardware evidence)'
        required: true
        default: rc
        type: choice
        options: [rc, beta, stable]

permissions:
  contents: read

jobs:
  build:
    name: build-signed-firmware
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      SOURCE_DATE_EPOCH: '1783468800'
    outputs:
      channel: ${{ steps.meta.outputs.channel }}
      version: ${{ steps.meta.outputs.version }}
      source_commit: ${{ steps.meta.outputs.source_commit }}
      artifact_name: ${{ steps.meta.outputs.artifact_name }}
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Resolve tag, version and production gate
        id: meta
        shell: bash
        env:
          REQUESTED_CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          source_commit=$(git rev-parse HEAD)
          [[ "$source_commit" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "v$version" || {
              echo "tag $GITHUB_REF_NAME must exactly match VERSION v$version" >&2
              exit 1
            }
            case "$version" in
              *-rc[1-9]*) channel=rc ;;
              *-beta[1-9]*) channel=beta ;;
              *) channel=stable ;;
            esac
          else
            channel=${REQUESTED_CHANNEL:-rc}
          fi
          ./scripts/build-imagebuilder.sh --channel "$channel" --print-output >/dev/null
          if [[ "$channel" == stable ]]; then
            evidence="production-gates/$version.env"
            test -f "$evidence" || {
              echo "stable is blocked: missing real-hardware evidence $evidence" >&2
              exit 1
            }
            ./scripts/verify-production-gate.sh "$evidence" "$version"
          fi
          {
            echo "version=$version"
            echo "channel=$channel"
            echo "source_commit=$source_commit"
            echo "artifact_name=companywrt-$channel-$version-$source_commit"
          } >> "$GITHUB_OUTPUT"
      - name: Require encrypted usign signing key
        shell: bash
        env:
          USIGN_SECRET_KEY: ${{ secrets.COMPANYWRT_USIGN_SECRET_KEY }}
        run: |
          set -euo pipefail
          test -n "$USIGN_SECRET_KEY" || {
            echo 'COMPANYWRT_USIGN_SECRET_KEY is missing; signed release builds fail closed' >&2
            exit 1
          }
          umask 077
          key_file="$RUNNER_TEMP/companywrt-usign.key"
          printf '%s\n' "$USIGN_SECRET_KEY" > "$key_file"
          echo "USIGN_SECRET_KEY_FILE=$key_file" >> "$GITHUB_ENV"
      - name: Install build and inspection dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends file jq shellcheck squashfs-tools
      - name: Run source checks
        run: |
          set -eu
          ./scripts/verify-shell.sh
          tests/ax9000/test-profile.sh
          tests/ax9000/test-network-generator.sh
          tests/ax9000/test-ota.sh
          tests/ax9000/test-ui.sh
          tests/ax9000/test-build-layout.sh
          tests/ax9000/test-content-source.sh
          tests/ax9000/test-enrollment-preflight.sh
          tests/ax9000/test-production-gate.sh
          tests/ax9000/test-workflows.sh
      - name: Build signed official ImageBuilder image
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/build-imagebuilder.sh \
            --profile xiaomi_ax9000 \
            --channel '${{ steps.meta.outputs.channel }}' \
            --source-commit '${{ steps.meta.outputs.source_commit }}'
      - name: Bind stable output to the hardware-tested firmware digest
        if: steps.meta.outputs.channel == 'stable'
        shell: bash
        run: |
          set -euo pipefail
          output="artifacts/${{ steps.meta.outputs.channel }}/${{ steps.meta.outputs.version }}"
          built_sha=$(sed -n 's/^SHA256=//p' "$output/RELEASE-MANIFEST")
          tested_sha=$(sed -n 's/^FIRMWARE_SHA256=//p' "production-gates/${{ steps.meta.outputs.version }}.env")
          test "$built_sha" = "$tested_sha" || {
            echo 'stable blocked: built firmware does not match the exact hardware-tested digest' >&2
            exit 1
          }
      - name: Verify release bundle and OTA download path end to end
        shell: bash
        run: |
          set -euo pipefail
          output="artifacts/${{ steps.meta.outputs.channel }}/${{ steps.meta.outputs.version }}"
          (cd "$output" && sha256sum -c SHA256SUMS)
          image=$(find "$output" -maxdepth 1 -type f -name '*sysupgrade.bin' -print -quit)
          usign_dir=$(dirname "$(find .build -path '*/staging_dir/host/bin/usign' -type f -print -quit)")
          test -n "$image" && test -n "$usign_dir"
          PATH="$usign_dir:$PATH" ./scripts/ota-check.sh \
            --manifest "$output/RELEASE-MANIFEST" \
            --signature "$output/RELEASE-MANIFEST.sig" \
            --image "$image" \
            --public-key keys/companywrt-release.pub \
            --download-dir "$RUNNER_TEMP/ota-e2e" \
            --version '${{ steps.meta.outputs.version }}' \
            --profile xiaomi_ax9000 --board xiaomi,ax9000 \
            --channel '${{ steps.meta.outputs.channel }}'
      - name: Destroy runner copy of signing key
        if: always()
        shell: bash
        run: |
          if [[ -n "${USIGN_SECRET_KEY_FILE:-}" && -f "$USIGN_SECRET_KEY_FILE" ]]; then
            shred -u "$USIGN_SECRET_KEY_FILE" 2>/dev/null || rm -f "$USIGN_SECRET_KEY_FILE"
          fi
      - name: Upload immutable build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: artifacts/${{ steps.meta.outputs.channel }}/${{ steps.meta.outputs.version }}/
          if-no-files-found: error
          retention-days: 30

  attest:
    name: attest-build-provenance
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download exact build artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: release
      - name: Attest every release asset
        id: provenance
        uses: actions/attest@c32b4b8b198b65d0bd9d63490e847ff7b53989d4 # v4.0.0
        with:
          subject-path: release/*
      - name: Preserve Sigstore bundle for release/offline audit
        run: cp '${{ steps.provenance.outputs.bundle-path }}' release/GITHUB-ATTESTATION.sigstore.json
      - name: Upload attested release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: attested-${{ needs.build.outputs.artifact_name }}
          path: release/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: publish-tagged-release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, attest]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download attested assets from the write-free jobs
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: attested-${{ needs.build.outputs.artifact_name }}
          path: release
      - name: Recheck tag and checksums before publishing
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "v${{ needs.build.outputs.version }}"
          grep -qx "TAG=$GITHUB_REF_NAME" release/RELEASE-MANIFEST
          grep -qx "SOURCE_COMMIT=${{ needs.build.outputs.source_commit }}" release/RELEASE-MANIFEST
          (cd release && sha256sum -c SHA256SUMS)
      - name: Publish immutable tag release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          prerelease=()
          if [[ '${{ needs.build.outputs.channel }}' != stable ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "CompanyWrt $GITHUB_REF_NAME (${{ needs.build.outputs.channel }})" \
            --notes-file release/RELEASE-NOTES.md \
            "${prerelease[@]}"
