name: CompanyWrt CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: checks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install static check dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends jq shellcheck
      - name: Shell, policy and metadata checks
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/verify-shell.sh
          for test_script in tests/ax9000/test-*.sh; do
            "$test_script"
          done
          test "$(cat VERSION)" = '25.12.5-company.2-rc2'
